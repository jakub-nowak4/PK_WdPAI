; Dolozone do domyslnego poola "www" (plik jest wczytywany po www.conf, bo nazwa sortuje sie
; pozniej w /usr/local/etc/php-fpm.d/*.conf). Wlacza wbudowany "ping" PHP-FPM: odpowiada "pong"
; bez wykonania zadnego pliku aplikacji, wiec healthcheck nie zalezy od bazy ani kodu PHP (T-107).
[www]
ping.path = /ping
ping.response = pong
