# Naglowki bezpieczenstwa (T-106). Dolaczany w bloku server w default.conf.
#
# UWAGA: add_header w bloku location ZASTEPUJE wszystkie add_header odziedziczone
# z server. Jesli kiedys jakis location dostanie wlasny add_header, trzeba w nim
# powtorzyc: include /etc/nginx/snippets/security-headers.conf;
# "always" dodaje naglowek takze do odpowiedzi 4xx/5xx (np. 404 z `return 404`).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# CSP dopasowane do aplikacji:
# - script-src: pliki z /js (w tym type="module") + jeden inline-skrypt anty-FOUC motywu
#   w <head> layoutu, dopuszczony hashem. Zmiana tresci tego skryptu (public/views/layout.html.php)
#   wymaga nowego hasha: sha256 tekstu miedzy <script> i </script>, base64.
#   Bloki <script type="application/json"> nie sa wykonywane, wiec CSP ich nie dotyczy.
# - style-src: /css/style.css + @import arkusza Google Fonts (Inter); brak atrybutow style="..." w widokach
#   (JS zmienia tylko element.style.display, co CSP dopuszcza).
# - font-src: pliki czcionek z Google Fonts.
# - img-src: zdjecia z /uploads i statyki wlasnej (data: na ewentualne male ikony).
# - connect-src: fetch() tylko do wlasnego origin (polling i oferty).
# - frame-ancestors/X-Frame-Options: aplikacja nie moze byc osadzona w ramce (clickjacking).
# - form-action 'self', base-uri 'self', object-src 'none': ograniczenie wstrzyknietych formularzy i <base>.
# HSTS (Strict-Transport-Security) celowo pominiety: ma sens tylko po HTTPS (wdrozenie, T-099).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UXdIbhrxQOIn479ulOScdZOT2zDkBm2q+/n/Zunk7cY='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
