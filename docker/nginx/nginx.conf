server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php index.html;

    # Nieco wiecej niz post_max_size w PHP (45M): za duze zadanie odrzuca PHP
    # z czytelnym komunikatem (422), a nie Nginx surowym 413.
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP wykonuje sie wylacznie przez front controller. Pozostale pliki .php
    # (widoki, partiale, ewentualne pliki w uploads) nie sa wykonywane: 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}