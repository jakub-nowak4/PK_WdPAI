server {
    listen 80;
    server_name _;

    # Nie ujawniaj wersji Nginx (naglowek Server, strony bledow).
    server_tokens off;

    # Przekierowania (np. /uploads -> /uploads/) bez schematu, hosta i portu: Location: /uploads/.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    root /app/public;
    index index.php index.html;

    # Dokladnie tyle, ile post_max_size w PHP (45M). Za duze zadanie odrzuca Nginx, zanim trafi do PHP-FPM:
    # gdyby cialo dotarlo do PHP, PHP odpowiedzialby 422 od razu, ale Nginx przestaje wtedy wysylac reszte
    # ciala i worker PHP-FPM czeka na nia do fastcgi_read_timeout (60 s), a odpowiedz sie nie konczy (T-110).
    client_max_body_size 45M;
    error_page 413 = @request_too_large;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP wykonuje sie wylacznie przez front controller. Pozostale pliki .php
    # (widoki, partiale, ewentualne pliki w uploads) nie sa wykonywane: 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # Za duze cialo (413): to samo zadanie (metoda, adres, ciasteczka) idzie do PHP bez ciala. Aplikacja
    # odpowiada wtedy zwyklym 422 "pliki sa za duze" (Request::isBodyDiscarded). CONTENT_LENGTH 0, bo
    # inaczej PHP-FPM czekalby na cialo, ktorego Nginx nie wysle. Parametr spoza HTTP_* nie moze byc podrobiony naglowkiem.
    location @request_too_large {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_pass_request_body off;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param CONTENT_LENGTH 0;
        fastcgi_param REQUEST_BODY_TOO_LARGE 1;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
