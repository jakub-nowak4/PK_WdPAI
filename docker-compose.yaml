services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/app
    depends_on:
      - php
    networks:
      - app-network
  
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    volumes:
      - app:/var/lib/postgresql
      - ./docker/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    environment: &php-environment
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@motobid.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MotoBid}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # CRON (kryterium 32): ten sam obraz i kod co `php`, ale zamiast PHP-FPM działa BusyBox crond (jest w Alpine).
  # Harmonogram jest w docker/cron/crontab (co minutę: bin/close-auctions.php); wyjście zadania idzie do logów
  # kontenera: docker compose logs cron. Zadania crond dziedziczą zmienne środowiskowe kontenera. `tr` usuwa
  # znaki CR, bo na Windows plik crontab może mieć zakończenia linii CRLF, których crond nie rozumie.
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["sh", "-c", "tr -d '\\r' < /app/docker/cron/crontab > /etc/crontabs/root && exec crond -f -l 8"]
    volumes:
      - .:/app
    environment: *php-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network


  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT}:8025"
    networks:
      - app-network

  pgadmin-wdpai:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - app-network
  
networks:
  app-network:

volumes:
  app: